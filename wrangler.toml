name = "electrotarifa"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "electrotarifa.eugenioazurmendi.com.ar", custom_domain = true }
]

# web/index.html y demás archivos estáticos; /api/* se ejecuta en el Worker
[assets]
directory = "./web"
run_worker_first = ["/api/*"]

[vars]
BETTER_AUTH_URL = "https://electrotarifa.eugenioazurmendi.com.ar"
DATABASE_URL = "libsql://electrotarifa-eugenioazurmendi.aws-us-east-1.turso.io"
# Secretos (NO van aquí): npx wrangler secret put DATABASE_AUTH_TOKEN / BETTER_AUTH_SECRET
